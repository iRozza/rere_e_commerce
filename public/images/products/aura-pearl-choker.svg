<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#242220" />
      <stop offset="100%" stop-color="#121110" />
    </radialGradient>
    <radialGradient id="pearl-grad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff8f2" />
      <stop offset="50%" stop-color="#f5e6d8" />
      <stop offset="75%" stop-color="#e0cfc2" />
      <stop offset="100%" stop-color="#b8a192" />
    </radialGradient>
    <linearGradient id="silver-chain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9d9d9" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#8a8a8a" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />

  <g transform="translate(400, 320)">
    <!-- Fine chain curve -->
    <path d="M -220,-120 C -120,80 -60,180 0,220 C 60,180 120,80 220,-120" 
          fill="none" stroke="url(#silver-chain)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,2" />

    <!-- Bail / cap -->
    <rect x="-6" y="210" width="12" height="18" rx="3" fill="#e8eaed" stroke="#777" stroke-width="1" />
    <circle cx="0" cy="215" r="4" fill="#ffffff" />

    <!-- Baroque Pearl (organic teardrop contour) -->
    <path d="M 0,228 C 30,230 45,260 42,300 C 38,345 22,375 0,380 C -22,375 -38,345 -42,300 C -45,260 -30,230 0,228 Z"
          fill="url(#pearl-grad)" />

    <!-- Iridescent Luster Highlight -->
    <ellipse cx="-12" cy="275" rx="14" ry="25" fill="#ffffff" opacity="0.8" transform="rotate(-15, -12, 275)" />
    <circle cx="8" cy="335" r="7" fill="#ffffff" opacity="0.4" />
  </g>

  <text x="400" y="720" font-family="'Playfair Display', serif" font-size="20" letter-spacing="4" fill="#a89a8c" text-anchor="middle" opacity="0.8">AVELUNE ATELIER</text>
  <text x="400" y="745" font-family="'Inter', sans-serif" font-size="12" letter-spacing="6" fill="#888" text-anchor="middle">AAA BAROQUE PEARL DROP</text>
</svg>

